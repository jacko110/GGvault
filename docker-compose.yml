version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ggvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ggvault}
      POSTGRES_USER: ${POSTGRES_USER:-ggvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ggvault}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ggvault-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
