name: ggvault-beta
x-runtime: &runtime
  build: { context: .., dockerfile: deploy/Dockerfile, target: runtime }
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  gateway:
    image: nginx:stable-alpine
    entrypoint: [sh, /opt/gateway-start.sh]
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:?Set PLAYER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      ADMIN_VPN_CIDR: ${ADMIN_VPN_CIDR:?Set the actual VPN client subnet}
      BETA_INVITE_CAP: ${BETA_INVITE_CAP:-10}
      NGINX_ENVSUBST_FILTER: '^(PLAYER_DOMAIN|ADMIN_DOMAIN|ADMIN_VPN_CIDR)$'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./gateway-start.sh:/opt/gateway-start.sh:ro
    secrets: [tls_cert, tls_key, player_access, admin_access]
    networks: [edge, frontend]
    depends_on: [web, admin]
  web:
    <<: *runtime
    command:
      [node, node_modules/next/dist/bin/next, start, apps/web, -p, '3000']
    environment:
      GGVAULT_SERVICE: web
      GGVAULT_APP: web
      WEB_ORIGIN: https://${PLAYER_DOMAIN:?Set PLAYER_DOMAIN}
      API_BASE_URL: http://api:3001
    secrets: [redis_password]
    networks: [frontend, application]
    depends_on: [api, redis]
  admin:
    <<: *runtime
    command:
      [node, node_modules/next/dist/bin/next, start, apps/admin, -p, '3002']
    environment:
      GGVAULT_SERVICE: admin
      GGVAULT_APP: admin
      WEB_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      API_BASE_URL: http://api:3001
    secrets: [redis_password]
    networks: [frontend, application]
    depends_on: [api, redis]
  api:
    <<: *runtime
    environment: &api-env
      GGVAULT_SERVICE: api
      POSTGRES_DB: ${POSTGRES_DB:-ggvault_beta}
      POSTGRES_USER: ${POSTGRES_USER:-ggvault}
      PORT: '3001'
      CORS_ORIGIN: https://${PLAYER_DOMAIN:?Set PLAYER_DOMAIN}
      BETA_MODE: 'true'
      ENABLE_TEST_CREDITS: 'true'
      INITIAL_TEST_CREDITS: '100'
      PLATFORM_FEE_BPS: '500'
      EVIDENCE_STORAGE_DIR: /app/storage/evidence
    secrets: [db_password, redis_password, jwt_secret]
    volumes: [evidence:/app/storage/evidence]
    networks: [application, database]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ggvault_beta}
      POSTGRES_USER: ggvault_owner
      APP_DB_USER: ${POSTGRES_USER:-ggvault}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [db_password, db_bootstrap_password]
    volumes:
      [
        postgres_data:/var/lib/postgresql/data,
        './postgres-init.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro',
      ]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: [sh, /opt/redis-start.sh]
    user: redis
    volumes: [redis_data:/data, './redis-start.sh:/opt/redis-start.sh:ro']
    tmpfs: ['/run/redis:uid=999,gid=1000,mode=0700']
    secrets: [redis_password]
    networks: [application]
  operations:
    profiles: [operations]
    build: { context: .., dockerfile: deploy/Dockerfile, target: operations }
    environment: *api-env
    secrets: [db_password, redis_password, jwt_secret]
    networks: [application, database]
    volumes: [evidence:/app/storage/evidence:ro]

networks:
  edge: {}
  frontend: { internal: true }
  application: { internal: true }
  database: { internal: true }
volumes:
  postgres_data: {}
  redis_data: {}
  evidence: {}
secrets:
  db_bootstrap_password:
    {
      file: '${DB_BOOTSTRAP_PASSWORD_FILE:?Provide separate bootstrap credential file reference}',
    }
  db_password:
    { file: '${DB_PASSWORD_FILE:?Provide operator-managed file reference}' }
  redis_password:
    { file: '${REDIS_PASSWORD_FILE:?Provide operator-managed file reference}' }
  jwt_secret:
    { file: '${JWT_SECRET_FILE:?Provide operator-managed file reference}' }
  tls_cert:
    { file: '${TLS_CERT_FILE:?Provide actual certificate file reference}' }
  tls_key: { file: '${TLS_KEY_FILE:?Provide actual key file reference}' }
  player_access:
    {
      file: '${PLAYER_ACCESS_FILE:?Provide individual tester htpasswd file reference}',
    }
  admin_access:
    {
      file: '${ADMIN_ACCESS_FILE:?Provide individual operator htpasswd file reference}',
    }
